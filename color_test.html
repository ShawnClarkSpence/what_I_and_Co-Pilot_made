<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color Test</title><style>*{box-sizing:border-box}body{margin:0;background:#151515;color:#fff;font-family:Arial,sans-serif}.wrap{padding:18px}.controls{position:sticky;top:0;z-index:5;background:#222;padding:12px;border-radius:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.value{font:13px Consolas,monospace}.section{margin-top:22px}.row{display:flex;gap:5px;overflow-x:auto;padding:4px 3px 10px}.swatch{flex:0 0 50px;width:50px;height:50px;border:1px solid #666;border-radius:4px;cursor:pointer}.swatch.selected{outline:3px solid white;outline-offset:-4px}.swatch:focus{outline:3px solid #00bfff;outline-offset:-4px}h1{margin:0 0 8px}h2{font-size:18px;margin:0 0 8px}input[type=color]{width:54px;height:38px;padding:2px}input[type=range]{width:140px}</style></head><body><main class="wrap"><h1>Color Test</h1><div class="controls"><label>Selected color <input id="picker" type="color" value="#ff0000"></label><label>Lightness <input id="light" type="range" min="-40" max="40" value="0"></label><label>Contrast <input id="contrast" type="range" min="50" max="150" value="100"></label><span id="adjust">Lightness 0 | Contrast 100%</span><div id="values" class="value"></div></div><div id="content"></div></main><script>
const content=document.getElementById('content'),picker=document.getElementById('picker'),values=document.getElementById('values'),light=document.getElementById('light'),contrast=document.getElementById('contrast'),adjust=document.getElementById('adjust');const clamp=v=>Math.max(0,Math.min(255,Math.round(v)));function hex(r,g,b){return '#'+[r,g,b].map(v=>clamp(v).toString(16).padStart(2,'0')).join('').toUpperCase()}function parseHex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}function cmyk(r,g,b){r/=255;g/=255;b/=255;let k=1-Math.max(r,g,b);if(k>=.999)return[0,0,0,100];return[(1-r-k)/(1-k),(1-g-k)/(1-k),(1-b-k)/(1-k),k].map(v=>Math.round(v*100))}function hslhsv(r,g,b){r/=255;g/=255;b/=255;let mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d){if(mx===r)h=60*(((g-b)/d)%6);else if(mx===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);if(h<0)h+=360}let l=(mx+mn)/2,sl=d?d/(1-Math.abs(2*l-1)):0,v=mx,sv=mx?d/mx:0;return[Math.round(h),Math.round(sl*100),Math.round(l*100),Math.round(sv*100),Math.round(v*100)]}function changed(rgb){let L=+light.value*2.55,C=+contrast.value/100;return rgb.map(v=>clamp((v-128)*C+128+L))}function show(h){let[r,g,b]=parseHex(h),[c,m,y,k]=cmyk(r,g,b),[hh,hs,hl,sv,v]=hslhsv(r,g,b);values.innerHTML=`HEX <b>${h.toUpperCase()}</b> &nbsp; RGB ${r},${g},${b} &nbsp; CMYK ${c}%,${m}%,${y}%,${k}%<br>HSL ${hh}&deg;,${hs}%,${hl}% &nbsp; HSV ${hh}&deg;,${sv}%,${v}%`}function ramp(fn,n=25){return Array.from({length:n},(_,i)=>fn(i/(n-1)))}const groups=[['White / Gray / Black',ramp(t=>{let v=255*(1-t);return[v,v,v]})],['Red',ramp(t=>[255*t,0,0])],['Green',ramp(t=>[0,255*t,0])],['Blue',ramp(t=>[0,0,255*t])],['Cyan',ramp(t=>[0,255*t,255*t])],['Magenta',ramp(t=>[255*t,0,255*t])],['Yellow',ramp(t=>[255*t,255*t,0])]];function render(){content.innerHTML=groups.map(([name,arr])=>`<section class="section"><h2>${name}</h2><div class="row">${arr.map(rgb=>{let h=hex(...changed(rgb));return `<div class="swatch" tabindex="0" role="button" aria-label="Select ${h}" data-color="${h}" style="background:${h}"></div>`}).join('')}</div></section>`).join('');document.querySelectorAll('.swatch').forEach(el=>{let select=()=>{document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');picker.value=el.dataset.color;show(el.dataset.color)};el.addEventListener('click',select);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}})});adjust.textContent=`Lightness ${light.value} | Contrast ${contrast.value}%`}picker.addEventListener('input',()=>show(picker.value));light.addEventListener('input',render);contrast.addEventListener('input',render);render();show(picker.value);
</script></body></html>
